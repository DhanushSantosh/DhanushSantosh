name: Generate GitHub profile cards

# Replaces the github-readme-stats.vercel.app badges in README.md — that's a
# shared, public, rate-limited third-party instance prone to going down.
# scripts/generate-profile-cards.mjs runs entirely in our own Actions
# minutes and renders cards matching this project's own dark-glass design
# system (see that file's header), committed as static SVGs to the
# `generated` branch. Deliberately NOT the `output` branch: snake.yml's
# crazy-max/ghaction-github-pages force-replaces that branch's entire
# history with just dist/ on every run, which would silently wipe this
# workflow's own commits out from under it. Also deliberately not committed
# to protected `main`: a bare push with no CI run against it would be
# rejected by the required "checks" status check.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Check out (or create) the generated branch
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin generated 2>/dev/null || true
          if git ls-remote --exit-code --heads origin generated > /dev/null; then
            git checkout generated
          else
            git checkout --orphan generated
            git rm -rf . > /dev/null
            git commit --allow-empty -m "Initialize generated branch"
            git push --set-upstream origin generated
          fi

      - name: Restore the generator script
        # The generated branch has no source of its own (it's an orphan
        # history of output only) — bring the script over from main's
        # checkout rather than switching branches back and forth.
        run: git show origin/main:scripts/generate-profile-cards.mjs > generate-profile-cards.mjs

      - name: Clean previous output
        # Full removal before regenerating, not just an overwrite, so a
        # discontinued generator's stale files (e.g. the previous
        # third-party action's transparent/ folder) can never linger.
        run: git rm -rq --ignore-unmatch -- profile-summary-card-output

      - name: Generate cards
        run: node generate-profile-cards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          rm generate-profile-cards.mjs
          git add profile-summary-card-output
          git commit -m "Update generated profile cards" || true
          git push
