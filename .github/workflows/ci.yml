name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # "lts/*" floats to whatever the current LTS major is — a new Node
          # major can land in CI on its own schedule, not this repo's,
          # without anyone deciding to take it. Pinned to match
          # package.json's engines field and, more importantly, the actual
          # Vercel deployment runtime — a prior pin to 26 here matched this
          # project's local dev machine but not Vercel, which doesn't
          # support Node 26 yet and rejected every build on this branch
          # ("Found invalid or discontinued Node.js Version: 26.x") until
          # this was caught during pre-merge verification.
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Dead code
        run: npm run deadcode

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        # GitHub Actions sets CI=true automatically, which is what makes
        # playwright.config.ts boot a real production build+start instead of
        # the dev server, and run forbidOnly/retries in their CI mode.
        run: npm run test:e2e
